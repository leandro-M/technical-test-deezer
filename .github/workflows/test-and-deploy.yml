name: Test and Deploy

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  test-and-check-coverage:
    name: Test and Check Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Tests and Check Coverage
        run: npm run test:coverage

      - name: Ensure 90% Coverage
        run: |
          node -e "
            const coverage = require('./coverage/coverage-final.json');
            let totalStatements = 0;
            let coveredStatements = 0;

            for (const file in coverage) {
              const fileCoverage = coverage[file].s;
              totalStatements += Object.keys(fileCoverage).length;
              coveredStatements += Object.values(fileCoverage).filter(val => val > 0).length;
            }

            const coveragePercent = (coveredStatements / totalStatements) * 100;

            if (coveragePercent < 90) {
              console.error('Coverage is below 90%: ' + coveragePercent.toFixed(2) + '%');
              process.exit(1);
            } else {
              console.log('Coverage is sufficient: ' + coveragePercent.toFixed(2) + '%');
            }
          "

  deploy:
    name: Deploy Application
    needs: test-and-check-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Create .env File
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env.production
          echo "VITE_API_KEY=${{ secrets.VITE_API_KEY }}" >> .env.production

      - name: Build Application
        run: npm run build:ghpages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
